name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [calendar_update, rebuild]
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync calendar events
        run: npm run sync:calendar

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Deploy dist to prod branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: $(git -C .. rev-parse --short HEAD)"
          git branch -M prod
          git push --force \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" \
            prod
      - name: Upload to FTP
        if: ${{ env.FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: hosting233865.ae9ed.netcup.net
          username: github-hnld-regio
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_SERVER_DIR != '' && format('{0}/', vars.FTP_SERVER_DIR) || './' }}
          local-dir: ./dist/
          protocol: ftp
          port: 21
          timeout: 60000

      - name: Warn when FTP password is missing
        if: ${{ env.FTP_PASSWORD == '' }}
        run: |
          echo "::error::FTP_PASSWORD fehlt — Upload übersprungen. Bitte Secret anlegen:"
          echo "::error::Repo-Settings → Secrets and variables → Actions → New repository secret → FTP_PASSWORD"
