name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [calendar_update, rebuild]
  schedule:
    # Registration capacity is cached in the static build; refresh it hourly.
    - cron: '0 * * * *'

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      CIVICRM_LEGACY_LINKS_ENABLED: ${{ vars.CIVICRM_LEGACY_LINKS_ENABLED }}
      SITE_URL: ${{ vars.SITE_URL || 'https://smj-wegweiser.de' }}
      CALENDAR_ICS_URL: ${{ vars.CALENDAR_ICS_URL }}
      PUBLIC_MATOMO_URL: ${{ vars.PUBLIC_MATOMO_URL }}
      PUBLIC_MATOMO_SITE_ID: ${{ vars.PUBLIC_MATOMO_SITE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync calendar events
        run: npm run sync:calendar

      - name: Sync CiviCRM registrations
        env:
          CIVICRM_API_KEY: ${{ secrets.CIVICRM_API_KEY }}
          CIVICRM_SITE_KEY: ${{ secrets.CIVICRM_SITE_KEY }}
        run: npm run sync:civicrm

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Generate Toolbox PHP config
        if: ${{ env.FTP_PASSWORD != '' }}
        env:
          AUTHENTIK_CLIENT_ID: ${{ secrets.AUTHENTIK_CLIENT_ID }}
          AUTHENTIK_CLIENT_SECRET: ${{ secrets.AUTHENTIK_CLIENT_SECRET }}
          TOOLBOX_APP_SECRET: ${{ secrets.TOOLBOX_APP_SECRET }}
          TOOLBOX_ALLOWED_GROUPS: ${{ vars.TOOLBOX_ALLOWED_GROUPS }}
          AUTHENTIK_URL: ${{ vars.AUTHENTIK_URL }}
          CIVICRM_API_KEY: ${{ secrets.CIVICRM_API_KEY }}
          CIVICRM_SITE_KEY: ${{ secrets.CIVICRM_SITE_KEY }}
        run: npm run build:toolbox-config

      - name: Upload private Toolbox files outside web root
        id: private_upload_first
        if: ${{ env.FTP_PASSWORD != '' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ae9ed.netcup.net
          username: github-hnld-regio
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./private/
          local-dir: ./dist-private/
          protocol: ftps
          security: strict
          port: 21
          timeout: 60000

      # Netcup occasionally resets the FTPS data connection while creating a
      # directory. A fresh connection can resume the same incremental upload.
      - name: Retry private Toolbox upload after FTPS disconnect
        if: ${{ env.FTP_PASSWORD != '' && steps.private_upload_first.outcome == 'failure' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ae9ed.netcup.net
          username: github-hnld-regio
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./private/
          local-dir: ./dist-private/
          protocol: ftps
          security: strict
          port: 21
          timeout: 60000

      - name: Upload to FTP
        if: ${{ env.FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ae9ed.netcup.net
          username: github-hnld-regio
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./public/
          local-dir: ./dist/
          protocol: ftps
          security: strict
          port: 21
          timeout: 60000

      - name: Verify Toolbox protection on webspace
        if: ${{ env.FTP_PASSWORD != '' }}
        run: node scripts/check-toolbox-deploy.mjs

      - name: Warn when FTP password is missing
        if: ${{ env.FTP_PASSWORD == '' }}
        run: |
          echo "::error::FTP_PASSWORD fehlt — Upload übersprungen. Bitte Secret anlegen:"
          echo "::error::Repo-Settings → Secrets and variables → Actions → New repository secret → FTP_PASSWORD"
