name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [calendar_update, rebuild]
  schedule:
    # Registration capacity is cached in the static build; refresh it hourly.
    - cron: '0 * * * *'

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      CIVICRM_LEGACY_LINKS_ENABLED: ${{ vars.CIVICRM_LEGACY_LINKS_ENABLED }}
      SITE_URL: ${{ vars.SITE_URL || 'https://smj-wegweiser.de' }}
      CALENDAR_ICS_URL: ${{ vars.CALENDAR_ICS_URL }}
      PUBLIC_MATOMO_URL: ${{ vars.PUBLIC_MATOMO_URL }}
      PUBLIC_MATOMO_SITE_ID: ${{ vars.PUBLIC_MATOMO_SITE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync calendar events
        run: npm run sync:calendar

      - name: Sync CiviCRM registrations
        env:
          CIVICRM_API_KEY: ${{ secrets.CIVICRM_API_KEY }}
          CIVICRM_SITE_KEY: ${{ secrets.CIVICRM_SITE_KEY }}
        run: npm run sync:civicrm

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Generate Toolbox PHP config
        if: ${{ env.FTP_PASSWORD != '' }}
        env:
          AUTHENTIK_CLIENT_ID: ${{ secrets.AUTHENTIK_CLIENT_ID }}
          AUTHENTIK_CLIENT_SECRET: ${{ secrets.AUTHENTIK_CLIENT_SECRET }}
          TOOLBOX_APP_SECRET: ${{ secrets.TOOLBOX_APP_SECRET }}
          TOOLBOX_ALLOWED_GROUPS: ${{ vars.TOOLBOX_ALLOWED_GROUPS }}
          AUTHENTIK_URL: ${{ vars.AUTHENTIK_URL }}
          CIVICRM_API_KEY: ${{ secrets.CIVICRM_API_KEY }}
          CIVICRM_SITE_KEY: ${{ secrets.CIVICRM_SITE_KEY }}
        run: npm run build:toolbox-config

      # --- 1. WEB UPLOAD (Öffentliche Website) ---
      - name: Upload public website to FTP
        id: public_upload_first
        if: ${{ env.FTP_PASSWORD != '' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ vars.FTP_SERVER || 'a2e85.netcup.net' }}
          username: ${{ vars.FTP_USERNAME || 'github-julius' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./public/
          local-dir: ./dist/
          protocol: ftps
          security: strict
          port: 21
          timeout: 60000

      - name: Retry public website upload after FTPS disconnect
        if: ${{ env.FTP_PASSWORD != '' && steps.public_upload_first.outcome == 'failure' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ vars.FTP_SERVER || 'a2e85.netcup.net' }}
          username: ${{ vars.FTP_USERNAME || 'github-julius' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./public/
          local-dir: ./dist/
          protocol: ftps
          security: strict
          port: 21
          timeout: 60000

      # --- 2. TOOL UPLOAD (Toolbox Kern-App & Configs außerhalb des Web-Roots) ---
      - name: Upload private Toolbox app outside web root
        id: tool_upload_first
        if: ${{ env.FTP_PASSWORD != '' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ vars.FTP_SERVER || 'a2e85.netcup.net' }}
          username: ${{ vars.FTP_USERNAME || 'github-julius' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./private/
          local-dir: ./dist-private/
          protocol: ftps
          security: strict
          port: 21
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            toolbox/briefe/**
            toolbox/flyers/**
            toolbox/social-images/**

      - name: Retry private Toolbox app upload after FTPS disconnect
        if: ${{ env.FTP_PASSWORD != '' && steps.tool_upload_first.outcome == 'failure' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ vars.FTP_SERVER || 'a2e85.netcup.net' }}
          username: ${{ vars.FTP_USERNAME || 'github-julius' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./private/
          local-dir: ./dist-private/
          protocol: ftps
          security: strict
          port: 21
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            toolbox/briefe/**
            toolbox/flyers/**
            toolbox/social-images/**

      # --- 3. GENERIERTE BEREICHE (Briefe, Flyer, Social Images) ---
      - name: Upload generated letters (briefe)
        id: briefe_upload_first
        if: ${{ env.FTP_PASSWORD != '' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ vars.FTP_SERVER || 'a2e85.netcup.net' }}
          username: ${{ vars.FTP_USERNAME || 'github-julius' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./private/toolbox/briefe/
          local-dir: ./dist-private/toolbox/briefe/
          protocol: ftps
          security: strict
          port: 21
          timeout: 60000

      - name: Retry generated letters upload after FTPS disconnect
        if: ${{ env.FTP_PASSWORD != '' && steps.briefe_upload_first.outcome == 'failure' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ vars.FTP_SERVER || 'a2e85.netcup.net' }}
          username: ${{ vars.FTP_USERNAME || 'github-julius' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./private/toolbox/briefe/
          local-dir: ./dist-private/toolbox/briefe/
          protocol: ftps
          security: strict
          port: 21
          timeout: 60000

      - name: Upload generated flyers
        id: flyers_upload_first
        if: ${{ env.FTP_PASSWORD != '' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ vars.FTP_SERVER || 'a2e85.netcup.net' }}
          username: ${{ vars.FTP_USERNAME || 'github-julius' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./private/toolbox/flyers/
          local-dir: ./dist-private/toolbox/flyers/
          protocol: ftps
          security: strict
          port: 21
          timeout: 60000

      - name: Retry generated flyers upload after FTPS disconnect
        if: ${{ env.FTP_PASSWORD != '' && steps.flyers_upload_first.outcome == 'failure' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ vars.FTP_SERVER || 'a2e85.netcup.net' }}
          username: ${{ vars.FTP_USERNAME || 'github-julius' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./private/toolbox/flyers/
          local-dir: ./dist-private/toolbox/flyers/
          protocol: ftps
          security: strict
          port: 21
          timeout: 60000

      - name: Upload generated social images
        id: social_upload_first
        if: ${{ env.FTP_PASSWORD != '' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ vars.FTP_SERVER || 'a2e85.netcup.net' }}
          username: ${{ vars.FTP_USERNAME || 'github-julius' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./private/toolbox/social-images/
          local-dir: ./dist-private/toolbox/social-images/
          protocol: ftps
          security: strict
          port: 21
          timeout: 60000

      - name: Retry generated social images upload after FTPS disconnect
        if: ${{ env.FTP_PASSWORD != '' && steps.social_upload_first.outcome == 'failure' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ vars.FTP_SERVER || 'a2e85.netcup.net' }}
          username: ${{ vars.FTP_USERNAME || 'github-julius' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./private/toolbox/social-images/
          local-dir: ./dist-private/toolbox/social-images/
          protocol: ftps
          security: strict
          port: 21
          timeout: 60000

      - name: Verify Toolbox protection on webspace
        if: ${{ env.FTP_PASSWORD != '' }}
        env:
          DEPLOY_HTTP_BASIC_AUTH: ${{ secrets.DEPLOY_HTTP_BASIC_AUTH }}
        run: node scripts/check-toolbox-deploy.mjs

      - name: Warn when FTP password is missing
        if: ${{ env.FTP_PASSWORD == '' }}
        run: |
          echo "::error::FTP_PASSWORD fehlt — Upload übersprungen. Bitte Secret anlegen:"
          echo "::error::Repo-Settings → Secrets and variables → Actions → New repository secret → FTP_PASSWORD"
